name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual triggers from the Actions tab
  workflow_dispatch: {}

# Least privilege: read-only by default. Only the deploy job gets
# pages: write + id-token: write (see below), so nothing the build job runs
# (npm packages, Lighthouse via npx) can mint a deploy token.
permissions:
  contents: read

# Cancel an in-flight build when a newer commit lands on main.
# The newest commit always wins.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version comes from .nvmrc (22.23 — Astro 7 needs >= 22.23.4),
      # matching package.json "engines". One source of truth for local and CI.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # npm ci ensures reproducible installs from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Every step below is a gate: if one fails, the job stops, nothing is
      # uploaded, and the deploy job (needs: build) never runs — the live
      # site keeps its last good version.

      # ── Gate 1: Type-check ────────────────────────────────────────────────
      # Includes content schema validation (e.g. a missing alt text in a
      # content file fails here). Runs first: fastest failure.
      - name: Type-check
        run: npm run check

      # ── Gate 2: Build the Astro site ──────────────────────────────────────
      - name: Build Astro site
        run: npm run build:site
        env:
          # Contact form (Web3Forms). Public by design; empty secret = form hidden.
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      # ── Gate 3: Every internal link and asset resolves under /portfolio ───
      - name: Check links
        run: npm run check:links

      # ── Gate 4: No draft project leaked into the build ────────────────────
      - name: Check drafts
        run: npm run check:drafts

      # ── Gate 5: No critical dependency advisory ───────────────────────────
      # Status and any accepted exceptions: docs/SECURITY.md (currently none).
      - name: Security audit
        run: npm audit --audit-level=critical

      # ── Lighthouse (mobile) on the 4 key pages — WARNING ONLY for now ─────
      # Never blocks the deploy: failures are ignored (continue-on-error) and a
      # hang is cut off after 10 min. Target: ≥ 95 in every category
      # (lighthouserc.json). Reports are kept as a build artifact.
      - name: Lighthouse CI (warning only)
        continue-on-error: true
        timeout-minutes: 10
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep Lighthouse reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

      # Configure the Pages environment before uploading the artifact
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload dist/ as the Pages artifact — this is what gets deployed
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # deploy job needs its own explicit permissions block
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ──────────────────────────────────────────────────────────────────────────────
# MANUAL SETUP (done once, in GitHub):
#
# 1. GitHub repo → Settings → Pages → Source = "GitHub Actions"
#    (not "Deploy from a branch" — that default will not work with this workflow)
#
# 2. Optional: Settings → Secrets and variables → Actions → New secret
#      WEB3FORMS_KEY → contact form access key (form stays hidden without it)
# ──────────────────────────────────────────────────────────────────────────────
