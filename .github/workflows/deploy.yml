name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual triggers from the Actions tab
  workflow_dispatch: {}

# Required for actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-flight build when a newer commit lands on main.
# This covers the race between Saad's manual pushes and Tina Cloud's
# content commits — the newest content always wins.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version comes from .nvmrc (22.23 — Astro 7 needs >= 22.23.4),
      # matching package.json "engines". One source of truth for local and CI.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # npm ci ensures reproducible installs from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Every step below is a gate: if one fails, the job stops, nothing is
      # uploaded, and the deploy job (needs: build) never runs — the live
      # site keeps its last good version.

      # ── Gate 1: Type-check ────────────────────────────────────────────────
      # Includes content schema validation (e.g. a missing alt text from a
      # bad CMS save fails here). Runs first: fastest failure.
      - name: Type-check
        run: npm run check

      # ── Gate 2: Build the Tina admin bundle ───────────────────────────────
      # Generates the static /admin UI into public/admin/. The only step that
      # needs the Tina Cloud credentials — secrets are scoped to it alone.
      - name: Build Tina admin
        run: npx tinacms build
        env:
          TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}

      # ── Gate 3: Build the Astro site ──────────────────────────────────────
      - name: Build Astro site
        run: npm run build:site

      # ── Gate 4: Every internal link and asset resolves under /portfolio ───
      - name: Check links
        run: npm run check:links

      # ── Gate 5: No draft project leaked into the build ────────────────────
      - name: Check drafts
        run: npm run check:drafts

      # ── Gate 6: No critical dependency advisory ───────────────────────────
      # Known, documented exceptions live in docs/SECURITY.md (none critical).
      - name: Security audit
        run: npm audit --audit-level=critical

      # Configure the Pages environment before uploading the artifact
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload dist/ as the Pages artifact — this is what gets deployed
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # deploy job needs its own explicit permissions block
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ──────────────────────────────────────────────────────────────────────────────
# MANUAL SETUP REQUIRED (Saad — these need your GitHub / Tina accounts):
#
# 1. GitHub repo → Settings → Pages → Source = "GitHub Actions"
#    (not "Deploy from a branch" — that default will not work with this workflow)
#
# 2. GitHub repo → Settings → Secrets and variables → Actions → New secret:
#      TINA_CLIENT_ID  → from your Tina Cloud dashboard (app.tina.io)
#      TINA_TOKEN      → from your Tina Cloud dashboard (read-only token)
#
# 3. Tina Cloud account setup (app.tina.io):
#    - Sign in with GitHub
#    - Register the smsaad-181/portfolio repository
#    - Copy the Client ID and token from the project settings
# ──────────────────────────────────────────────────────────────────────────────
